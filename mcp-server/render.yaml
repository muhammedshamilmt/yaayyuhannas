services:
  - type: web
    name: ayyuhannas-fest-mcp
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: wattaqa-festival-2k25
      - key: MCP_AUTH_TOKEN
        generateValue: true
      - key: READ_ONLY
        value: "true"
      - key: MAX_DOCUMENTS_LIMIT
        value: "100"
